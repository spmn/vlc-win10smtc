name: Build plugin

# Shared build, called by both build.yml (CI) and release.yml.
on:
  workflow_call:
    inputs:
      fail-fast:
        description: Stop the other architectures once one of them fails.
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        platform: [x64, x86, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Fetch VLC SDKs
        shell: pwsh
        run: ./tools/fetch-sdks.ps1 -Platform ${{ matrix.platform }}

      - uses: microsoft/setup-msbuild@v2

      - name: Short commit id
        id: commit
        run: '"short_sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT'

      - name: Build
        run: >
          msbuild vlc-win10smtc.sln -m
          -p:Configuration=Release
          -p:Platform=${{ matrix.platform }}
          -p:PluginBuildId=${{ steps.commit.outputs.short_sha }}
          -p:OutDir=${{ github.workspace }}\out\

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: libwin10smtc_plugin_${{ matrix.platform }}
          path: |
            out/libwin10smtc_plugin.dll
            out/libwin10smtc_plugin.pdb
          if-no-files-found: error
